name: CI/CD to OCI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Secrets files
        run: |
          echo "${{ secrets.ENV }}" | base64 --decode > ./.env

          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_SECRET }}" | base64 --decode > ./src/main/resources/application-prod.yml

      - name: Build jar
        run: ./gradlew clean bootJar -x test

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/study_project:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/study_project:${{ github.sha }} \
            .

      - name: Push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/study_project
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # main 브랜치에 push된 경우에만 실제 배포 (PR에서는 build만)
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/app

            echo "${{ secrets.ENV }}" | base64 --decode > ./.env

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker compose -f docker-compose-prod.yml pull backend
            docker compose -f docker-compose-prod.yml up -d

            docker image prune -f