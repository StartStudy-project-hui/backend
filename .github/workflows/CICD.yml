name: CI/CD to OCI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Secrets files
        run: |
          pwd
          touch ./env 
          echo ${{ secrets.ENV }} | base64 --decode > ./.env
          
          cd ./src/main/resources
          touch ./application-prod.yml 
          echo ${{ secrets.APPLICATION_SECRET }} | base64 --decode > ./application-prod.yml

      - name: Build jar
        run: ./gradlew clean bootJar -x test

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/study_project:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/study_project:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/study_project:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/study_project:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            cd ~/
            git pull origin main
            echo "${{ secrets.ENV }}" | base64 --decode > .env
            echo ${{ secrets.APPLICATION_SECRET }} | base64 --decode > ./src/main/resources/application-prod.yml

            docker compose -f docker-compose-prod.yml pull backend
            docker compose -f docker-compose-prod.yml up -d
            docker image prune -f